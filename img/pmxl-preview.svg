<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with slight gradient -->
  <linearGradient id="bg-gradient-pmxl" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#f8f9fa" />
    <stop offset="100%" stop-color="#e9ecef" />
  </linearGradient>
  <rect width="800" height="450" fill="url(#bg-gradient-pmxl)" rx="10" ry="10"/>
  
  <!-- Header in project management theme color -->
  <rect width="800" height="60" fill="#2c3e50" rx="10" ry="10"/>
  <text x="40" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">PMxl - Excel-based Project Management</text>
  
  <!-- Left Side Navigation -->
  <rect x="40" y="80" width="200" height="350" fill="#34495e" rx="5" ry="5"/>
  
  <!-- Navigation Items -->
  <rect x="40" y="80" width="200" height="50" fill="#3498db" rx="5" ry="5"/>
  <text x="60" y="110" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Dashboard</text>
  
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Projects</text>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Tasks</text>
  <text x="60" y="270" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Resources</text>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Reports</text>
  <text x="60" y="370" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Settings</text>
  
  <!-- Main Content Area - Gantt Chart -->
  <rect x="260" y="80" width="520" height="350" fill="#ffffff" rx="5" ry="5"/>
  
  <!-- Gantt Chart Header -->
  <rect x="260" y="80" width="520" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="5" ry="5"/>
  <text x="280" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Commercial Building Project Timeline</text>
  
  <!-- Timeline Header -->
  <rect x="460" y="120" width="320" height="30" fill="#e9ecef" stroke="#dee2e6" stroke-width="1"/>
  <text x="480" y="140" font-family="Arial, sans-serif" font-size="12" fill="#495057">Apr</text>
  <text x="560" y="140" font-family="Arial, sans-serif" font-size="12" fill="#495057">May</text>
  <text x="640" y="140" font-family="Arial, sans-serif" font-size="12" fill="#495057">Jun</text>
  <text x="720" y="140" font-family="Arial, sans-serif" font-size="12" fill="#495057">Jul</text>
  
  <!-- Tasks -->
  <rect x="260" y="150" width="200" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="270" y="170" font-family="Arial, sans-serif" font-size="12" fill="#212529">Site Preparation</text>
  
  <rect x="260" y="180" width="200" height="30" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="270" y="200" font-family="Arial, sans-serif" font-size="12" fill="#212529">Foundation</text>
  
  <rect x="260" y="210" width="200" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="270" y="230" font-family="Arial, sans-serif" font-size="12" fill="#212529">Framing</text>
  
  <rect x="260" y="240" width="200" height="30" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="270" y="260" font-family="Arial, sans-serif" font-size="12" fill="#212529">Electrical and Plumbing</text>
  
  <rect x="260" y="270" width="200" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="270" y="290" font-family="Arial, sans-serif" font-size="12" fill="#212529">Drywall and Finishing</text>
  
  <rect x="260" y="300" width="200" height="30" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="270" y="320" font-family="Arial, sans-serif" font-size="12" fill="#212529">Inspection</text>
  
  <!-- Gantt Chart Bars -->
  <rect x="460" y="150" width="80" height="30" fill="#3498db" rx="3" ry="3" opacity="0.8"/>
  <rect x="460" y="180" width="120" height="30" fill="#2ecc71" rx="3" ry="3" opacity="0.8"/>
  <rect x="540" y="210" width="100" height="30" fill="#9b59b6" rx="3" ry="3" opacity="0.8"/>
  <rect x="600" y="240" width="100" height="30" fill="#e74c3c" rx="3" ry="3" opacity="0.8"/>
  <rect x="640" y="270" width="100" height="30" fill="#f1c40f" rx="3" ry="3" opacity="0.8"/>
  <rect x="700" y="300" width="50" height="30" fill="#1abc9c" rx="3" ry="3" opacity="0.8"/>
  
  <!-- Progress Indicators -->
  <rect x="460" y="150" width="60" height="30" fill="#2980b9" rx="3" ry="3" opacity="0.8"/>
  <rect x="460" y="180" width="70" height="30" fill="#27ae60" rx="3" ry="3" opacity="0.8"/>
  <rect x="540" y="210" width="40" height="30" fill="#8e44ad" rx="3" ry="3" opacity="0.8"/>
  
  <!-- Today Marker -->
  <line x1="570" y1="120" x2="570" y2="350" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Bottom Controls -->
  <rect x="260" y="350" width="520" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <rect x="280" y="360" width="100" height="25" fill="#3498db" rx="3" ry="3"/>
  <text x="330" y="377" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Export to Excel</text>
  
  <rect x="400" y="360" width="100" height="25" fill="#2c3e50" rx="3" ry="3"/>
  <text x="450" y="377" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Share</text>
  
  <rect x="520" y="360" width="100" height="25" fill="#27ae60" rx="3" ry="3"/>
  <text x="570" y="377" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Update</text>
</svg>