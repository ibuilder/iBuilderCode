<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (Optional - set to transparent) -->
  <rect width="800" height="800" fill="transparent"/>
  
  <!-- Tower Crane -->
  <g id="crane">
    <!-- Crane Tower -->
    <rect x="370" y="200" width="60" height="350" fill="#1A365D" stroke="#0F172A" stroke-width="4"/>
    
    <!-- Crane Cross Supports -->
    <line x1="370" y1="250" x2="340" y2="280" stroke="#1A365D" stroke-width="12"/>
    <line x1="430" y1="250" x2="460" y2="280" stroke="#1A365D" stroke-width="12"/>
    <line x1="370" y1="300" x2="340" y2="330" stroke="#1A365D" stroke-width="12"/>
    <line x1="430" y1="300" x2="460" y2="330" stroke="#1A365D" stroke-width="12"/>
    <line x1="370" y1="350" x2="340" y2="380" stroke="#1A365D" stroke-width="12"/>
    <line x1="430" y1="350" x2="460" y2="380" stroke="#1A365D" stroke-width="12"/>
    <line x1="370" y1="400" x2="340" y2="430" stroke="#1A365D" stroke-width="12"/>
    <line x1="430" y1="400" x2="460" y2="430" stroke="#1A365D" stroke-width="12"/>
    <line x1="370" y1="450" x2="340" y2="480" stroke="#1A365D" stroke-width="12"/>
    <line x1="430" y1="450" x2="460" y2="480" stroke="#1A365D" stroke-width="12"/>
    
    <!-- Crane Arm -->
    <rect x="240" y="170" width="500" height="30" fill="#F59E0B" stroke="#D97706" stroke-width="4"/>
    
    <!-- Crane Arm Supports -->
    <polygon points="400,170 400,100 430,100 430,170" fill="#F59E0B" stroke="#D97706" stroke-width="4"/>
    <line x1="400" y1="150" x2="300" y2="170" stroke="#F59E0B" stroke-width="12"/>
    <line x1="430" y1="150" x2="530" y2="170" stroke="#F59E0B" stroke-width="12"/>
    
    <!-- Crane Arm Truss Structure -->
    <line x1="270" y1="170" x2="270" y2="140" stroke="#F59E0B" stroke-width="8"/>
    <line x1="320" y1="170" x2="320" y2="140" stroke="#F59E0B" stroke-width="8"/>
    <line x1="370" y1="170" x2="370" y2="140" stroke="#F59E0B" stroke-width="8"/>
    <line x1="470" y1="170" x2="470" y2="140" stroke="#F59E0B" stroke-width="8"/>
    <line x1="520" y1="170" x2="520" y2="140" stroke="#F59E0B" stroke-width="8"/>
    <line x1="570" y1="170" x2="570" y2="140" stroke="#F59E0B" stroke-width="8"/>
    <line x1="620" y1="170" x2="620" y2="140" stroke="#F59E0B" stroke-width="8"/>
    <line x1="670" y1="170" x2="670" y2="140" stroke="#F59E0B" stroke-width="8"/>
    
    <!-- Crane Cabin -->
    <rect x="340" y="200" width="120" height="80" fill="#F59E0B" stroke="#D97706" stroke-width="4" rx="10"/>
    <rect x="360" y="220" width="80" height="40" fill="#2563EB" stroke="#1E40AF" stroke-width="2" rx="5"/>
    
    <!-- Crane Hook -->
    <rect x="280" y="170" width="20" height="20" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
    <line x1="290" y1="190" x2="290" y2="230" stroke="#1A365D" stroke-width="6"/>
    <path d="M280,230 C280,240 300,240 300,230" fill="none" stroke="#1A365D" stroke-width="6"/>
  </g>
  
  <!-- Text "iBuilder Code" -->
  <g id="text">
    <!-- "i" Dot -->
    <circle cx="160" cy="500" r="25" fill="#F59E0B"/>
    
    <!-- "i" Stem -->
    <text x="160" y="600" font-family="Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="#F59E0B">i</text>
    
    <!-- "Builder" -->
    <text x="400" y="600" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#F59E0B">Builder</text>
    
    <!-- "Code" -->
    <text x="400" y="700" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#F8BD78">Code</text>
  </g>
</svg>
