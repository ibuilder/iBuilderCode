<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with slight gradient -->
  <linearGradient id="bg-gradient-brownstone" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#f8f9fa" />
    <stop offset="100%" stop-color="#e9ecef" />
  </linearGradient>
  <rect width="800" height="450" fill="url(#bg-gradient-brownstone)" rx="10" ry="10"/>
  
  <!-- Header in brownstone color -->
  <rect width="800" height="60" fill="#8B4513" rx="10" ry="10"/>
  <text x="40" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">NYC Brownstone Renovation Calculator</text>
  
  <!-- Brownstone Illustration -->
  <g transform="translate(40, 100) scale(0.8)">
    <!-- Building Base -->
    <rect x="30" y="100" width="300" height="280" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
    
    <!-- Stoop -->
    <polygon points="330,380 400,380 400,310 330,310" fill="#7A3B11" stroke="#5D2906" stroke-width="2"/>
    <rect x="340" y="320" width="50" height="10" fill="#5D2906"/>
    <rect x="340" y="340" width="50" height="10" fill="#5D2906"/>
    <rect x="340" y="360" width="50" height="10" fill="#5D2906"/>
    
    <!-- Windows -->
    <rect x="60" y="130" width="60" height="90" fill="#D6EAF8" stroke="#5D2906" stroke-width="2"/>
    <rect x="150" y="130" width="60" height="90" fill="#D6EAF8" stroke="#5D2906" stroke-width="2"/>
    <rect x="240" y="130" width="60" height="90" fill="#D6EAF8" stroke="#5D2906" stroke-width="2"/>
    
    <rect x="60" y="260" width="60" height="90" fill="#D6EAF8" stroke="#5D2906" stroke-width="2"/>
    <rect x="150" y="260" width="60" height="90" fill="#D6EAF8" stroke="#5D2906" stroke-width="2"/>
    <rect x="240" y="260" width="60" height="90" fill="#D6EAF8" stroke="#5D2906" stroke-width="2"/>
    
    <!-- Door -->
    <rect x="150" y="290" width="60" height="90" fill="#5D2906" stroke="#3D1906" stroke-width="2"/>
    <circle cx="195" cy="335" r="5" fill="#D4AF37"/>
    
    <!-- Roof -->
    <rect x="20" y="80" width="320" height="20" fill="#5D2906" stroke="#3D1906" stroke-width="2"/>
  </g>
  
  <!-- Calculator Interface -->
  <rect x="380" y="100" width="380" height="310" fill="#ffffff" stroke="#dee2e6" stroke-width="1" rx="5" ry="5"/>
  
  <!-- Form Title -->
  <rect x="380" y="100" width="380" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="5" ry="5"/>
  <text x="570" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5D2906" text-anchor="middle">Renovation Cost Calculator</text>
  
  <!-- Form Elements -->
  <text x="400" y="165" font-family="Arial, sans-serif" font-size="14" fill="#495057">Square Footage:</text>
  <rect x="520" y="150" width="220" height="30" fill="#f1f3f5" stroke="#ced4da" stroke-width="1" rx="4" ry="4"/>
  <text x="530" y="170" font-family="Arial, sans-serif" font-size="14" fill="#495057">3,200 sq ft</text>
  
  <text x="400" y="205" font-family="Arial, sans-serif" font-size="14" fill="#495057">Number of Floors:</text>
  <rect x="520" y="190" width="220" height="30" fill="#f1f3f5" stroke="#ced4da" stroke-width="1" rx="4" ry="4"/>
  <text x="530" y="210" font-family="Arial, sans-serif" font-size="14" fill="#495057">4</text>
  
  <text x="400" y="245" font-family="Arial, sans-serif" font-size="14" fill="#495057">Renovation Level:</text>
  <rect x="520" y="230" width="220" height="30" fill="#f1f3f5" stroke="#ced4da" stroke-width="1" rx="4" ry="4"/>
  <text x="530" y="250" font-family="Arial, sans-serif" font-size="14" fill="#495057">High-End</text>
  
  <text x="400" y="285" font-family="Arial, sans-serif" font-size="14" fill="#495057">Historic Features:</text>
  <rect x="520" y="270" width="220" height="30" fill="#f1f3f5" stroke="#ced4da" stroke-width="1" rx="4" ry="4"/>
  <text x="530" y="290" font-family="Arial, sans-serif" font-size="14" fill="#495057">Moderate</text>
  
  <!-- Results -->
  <rect x="400" y="320" width="340" height="40" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" rx="4" ry="4"/>
  <text x="410" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Estimated Cost:</text>
  <text x="700" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B4513" text-anchor="end">$2,240,000</text>
  
  <!-- Action Button -->
  <rect x="570" y="370" width="170" height="40" fill="#8B4513" rx="4" ry="4"/>
  <text x="655" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Generate Detailed Report</text>
</svg>