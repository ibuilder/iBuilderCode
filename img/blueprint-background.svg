<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Blueprint Background -->
  <rect width="1200" height="600" fill="#0a3a7d"/>
  
  <!-- Blueprint Grid -->
  <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a4a8d" stroke-width="0.5"/>
  </pattern>
  <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
    <rect width="100" height="100" fill="url(#smallGrid)"/>
    <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#1a4a8d" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="600" fill="url(#grid)"/>
  
  <!-- Blueprint Elements -->
  <!-- Building Outline -->
  <rect x="300" y="150" width="600" height="300" fill="none" stroke="#4a9aff" stroke-width="2"/>
  
  <!-- Windows and Doors -->
  <rect x="350" y="200" width="100" height="150" fill="none" stroke="#4a9aff" stroke-width="2"/>
  <rect x="550" y="200" width="100" height="150" fill="none" stroke="#4a9aff" stroke-width="2"/>
  <rect x="750" y="200" width="100" height="150" fill="none" stroke="#4a9aff" stroke-width="2"/>
  <rect x="550" y="400" width="100" height="50" fill="none" stroke="#4a9aff" stroke-width="2"/>
  
  <!-- Dimensions -->
  <line x1="300" y1="120" x2="900" y2="120" stroke="#6abaff" stroke-width="1"/>
  <line x1="300" y1="120" x2="300" y2="130" stroke="#6abaff" stroke-width="1"/>
  <line x1="900" y1="120" x2="900" y2="130" stroke="#6abaff" stroke-width="1"/>
  <text x="600" y="115" font-family="Arial, sans-serif" font-size="12" fill="#6abaff" text-anchor="middle">600 cm</text>
  
  <line x1="270" y1="150" x2="270" y2="450" stroke="#6abaff" stroke-width="1"/>
  <line x1="270" y1="150" x2="280" y2="150" stroke="#6abaff" stroke-width="1"/>
  <line x1="270" y1="450" x2="280" y2="450" stroke="#6abaff" stroke-width="1"/>
  <text x="260" y="300" font-family="Arial, sans-serif" font-size="12" fill="#6abaff" text-anchor="middle" transform="rotate(-90, 260, 300)">300 cm</text>
  
  <!-- Compass -->
  <circle cx="1100" cy="500" r="40" fill="none" stroke="#6abaff" stroke-width="1"/>
  <line x1="1100" y1="500" x2="1100" y2="470" stroke="#6abaff" stroke-width="2"/>
  <line x1="1100" y1="500" x2="1130" y2="500" stroke="#6abaff" stroke-width="1"/>
  <text x="1100" y="465" font-family="Arial, sans-serif" font-size="14" fill="#6abaff" text-anchor="middle">N</text>
  <text x="1135" y="505" font-family="Arial, sans-serif" font-size="14" fill="#6abaff" text-anchor="middle">E</text>
  
  <!-- Code Elements -->
  <path d="M 100,200 L 60,300 L 100,400" fill="none" stroke="#6abaff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 180,200 L 220,300 L 180,400" fill="none" stroke="#6abaff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Title Block -->
  <rect x="900" y="50" width="250" height="100" fill="none" stroke="#4a9aff" stroke-width="1"/>
  <line x1="900" y1="80" x2="1150" y2="80" stroke="#4a9aff" stroke-width="1"/>
  <text x="1025" y="70" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">iBuilder Code</text>
  <text x="1025" y="100" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Building the Future with Code</text>
  <text x="1025" y="130" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Scale: 1:100 | Date: 2025-04-30</text>
</svg>