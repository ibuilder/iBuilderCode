<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with slight gradient -->
  <linearGradient id="bg-gradient-rexl" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#f8f9fa" />
    <stop offset="100%" stop-color="#e9ecef" />
  </linearGradient>
  <rect width="800" height="450" fill="url(#bg-gradient-rexl)" rx="10" ry="10"/>
  
  <!-- Header in real estate theme color -->
  <rect width="800" height="60" fill="#006837" rx="10" ry="10"/>
  <text x="40" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">RExl - Real Estate Excel Analysis Tool</text>
  
  <!-- Dashboard Layout -->
  <rect x="40" y="80" width="720" height="350" fill="#ffffff" rx="5" ry="5"/>
  
  <!-- Top Panel - Property Information -->
  <rect x="40" y="80" width="720" height="80" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="5" ry="5"/>
  <text x="60" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#006837">Property Analysis: 2405 Broadway Ave, Manhattan</text>
  
  <text x="60" y="140" font-family="Arial, sans-serif" font-size="14" fill="#495057">Mixed-Use Building | 5 Stories | 10,500 sq ft | Asking: $4,800,000</text>
  
  <!-- Left Panel - Financial Summary -->
  <rect x="40" y="170" width="350" height="260" fill="#ffffff" stroke="#dee2e6" stroke-width="1" rx="5" ry="5"/>
  
  <!-- Panel Header -->
  <rect x="40" y="170" width="350" height="40" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" rx="5" ry="5"/>
  <text x="60" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Financial Summary</text>
  
  <!-- Financial Items -->
  <text x="60" y="235" font-family="Arial, sans-serif" font-size="14" fill="#212529">Purchase Price:</text>
  <text x="350" y="235" font-family="Arial, sans-serif" font-size="14" fill="#212529" text-anchor="end">$4,800,000</text>
  
  <text x="60" y="265" font-family="Arial, sans-serif" font-size="14" fill="#212529">Annual Revenue:</text>
  <text x="350" y="265" font-family="Arial, sans-serif" font-size="14" fill="#212529" text-anchor="end">$480,000</text>
  
  <text x="60" y="295" font-family="Arial, sans-serif" font-size="14" fill="#212529">Annual Expenses:</text>
  <text x="350" y="295" font-family="Arial, sans-serif" font-size="14" fill="#212529" text-anchor="end">$168,000</text>
  
  <text x="60" y="325" font-family="Arial, sans-serif" font-size="14" fill="#212529">Net Operating Income:</text>
  <text x="350" y="325" font-family="Arial, sans-serif" font-size="14" fill="#212529" text-anchor="end">$312,000</text>
  
  <text x="60" y="355" font-family="Arial, sans-serif" font-size="14" fill="#212529">Cap Rate:</text>
  <text x="350" y="355" font-family="Arial, sans-serif" font-size="14" fill="#006837" font-weight="bold" text-anchor="end">6.5%</text>
  
  <text x="60" y="385" font-family="Arial, sans-serif" font-size="14" fill="#212529">Cash on Cash Return:</text>
  <text x="350" y="385" font-family="Arial, sans-serif" font-size="14" fill="#006837" font-weight="bold" text-anchor="end">8.2%</text>
  
  <text x="60" y="415" font-family="Arial, sans-serif" font-size="14" fill="#212529">IRR (10yr):</text>
  <text x="350" y="415" font-family="Arial, sans-serif" font-size="14" fill="#006837" font-weight="bold" text-anchor="end">12.4%</text>
  
  <!-- Right Panel - ROI Chart -->
  <rect x="410" y="170" width="350" height="260" fill="#ffffff" stroke="#dee2e6" stroke-width="1" rx="5" ry="5"/>
  
  <!-- Chart Header -->
  <rect x="410" y="170" width="350" height="40" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" rx="5" ry="5"/>
  <text x="430" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">10-Year Return Projection</text>
  
  <!-- Simplified Chart -->
  <!-- Axes -->
  <line x1="450" y1="380" x2="730" y2="380" stroke="#495057" stroke-width="2"/>
  <line x1="450" y1="380" x2="450" y2="230" stroke="#495057" stroke-width="2"/>
  
  <!-- Y-Axis Labels -->
  <text x="440" y="230" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="end">$8M</text>
  <text x="440" y="270" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="end">$6M</text>
  <text x="440" y="310" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="end">$4M</text>
  <text x="440" y="350" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="end">$2M</text>
  <text x="440" y="390" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="end">$0</text>
  
  <!-- X-Axis Labels -->
  <text x="450" y="395" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">0</text>
  <text x="498" y="395" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">2</text>
  <text x="546" y="395" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">4</text>
  <text x="594" y="395" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">6</text>
  <text x="642" y="395" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">8</text>
  <text x="690" y="395" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">10</text>
  <text x="590" y="410" font-family="Arial, sans-serif" font-size="12" fill="#495057" text-anchor="middle">Years</text>
  
  <!-- Plot Lines -->
  <polyline points="450,380 498,370 546,360 594,345 642,325 690,300" fill="none" stroke="#28a745" stroke-width="3"/>
  <polyline points="450,380 498,375 546,365 594,350 642,330 690,280" fill="none" stroke="#006837" stroke-width="3"/>
  
  <!-- Plot Area -->
  <path d="M450,380 L498,370 L546,360 L594,345 L642,325 L690,300 L690,380 Z" fill="#28a745" opacity="0.2"/>
  
  <!-- Legend -->
  <rect x="550" y="230" width="12" height="12" fill="#28a745"/>
  <text x="570" y="240" font-family="Arial, sans-serif" font-size="12" fill="#212529">Cash Flow</text>
  
  <rect x="550" y="250" width="12" height="12" fill="#006837"/>
  <text x="570" y="260" font-family="Arial, sans-serif" font-size="12" fill="#212529">Total Return w/ Appreciation</text>
</svg>