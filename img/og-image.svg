<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a3a7d"/>
  
  <!-- Blueprint Grid Pattern - Subtle -->
  <pattern id="smallGridOG" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a4a8d" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#smallGridOG)" opacity="0.3"/>
  
  <!-- Logo Left Side -->
  <g transform="translate(150, 315) scale(0.8)">
    <!-- Code Brackets -->
    <path d="M160,150 L120,250 L160,350" fill="none" stroke="#ffffff" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M340,150 L380,250 L340,350" fill="none" stroke="#ffffff" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Building/Construction Element -->
    <rect x="210" y="150" width="80" height="200" fill="#ffffff" rx="5" ry="5"/>
    <rect x="190" y="180" width="120" height="20" fill="#0a3a7d" rx="2" ry="2"/>
    <rect x="190" y="230" width="120" height="20" fill="#0a3a7d" rx="2" ry="2"/>
    <rect x="190" y="280" width="120" height="20" fill="#0a3a7d" rx="2" ry="2"/>
    <rect x="190" y="330" width="120" height="20" fill="#0a3a7d" rx="2" ry="2"/>
    
    <!-- "i" dot -->
    <circle cx="180" cy="120" r="20" fill="#ffffff"/>
  </g>
  
  <!-- Text Content -->
  <text x="600" y="260" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#ffffff">iBuilder Code</text>
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="36" text-anchor="middle" fill="#ffffff">Building Software Solutions for Construction</text>
  
  <!-- Blueprint Elements - Decorative -->
  <g transform="translate(750, 400) scale(0.6)">
    <rect x="300" y="150" width="600" height="300" fill="none" stroke="#4a9aff" stroke-width="2"/>
    <rect x="350" y="200" width="100" height="150" fill="none" stroke="#4a9aff" stroke-width="2"/>
    <rect x="550" y="200" width="100" height="150" fill="none" stroke="#4a9aff" stroke-width="2"/>
    <rect x="750" y="200" width="100" height="150" fill="none" stroke="#4a9aff" stroke-width="2"/>
    <rect x="550" y="400" width="100" height="50" fill="none" stroke="#4a9aff" stroke-width="2"/>
  </g>
  
  <!-- Bottom URL -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#ffffff">www.ibuildercode.com</text>
</svg>